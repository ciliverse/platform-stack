# Runs GitLab CI jobs in-cluster. Default: disabled.
# gitlabUrl, runnerToken and hostAliases come from values/private.yaml via helmfile.
# Chart 0.89 ignores runners.privileged; DinD needs privileged in runners.config.
rbac:
  create: true
# Each concurrent job is a pod plus its DinD sidecar; the chart default of 10
# is a large burst; 5 is a safer start on a small cluster.
concurrent: 5
runners:
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "{{ default .Release.Namespace .Values.runners.jobNamespace }}"
        image = "alpine"
        privileged = true
