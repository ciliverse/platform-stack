{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
{{- if and .Values.letsencrypt.enabled .Values.letsencrypt.email }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: {{ .Values.letsencrypt.email | quote }}
    server: {{ .Values.letsencrypt.server | quote }}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: {{ .Values.letsencrypt.ingressClass | quote }}
{{- end }}
{{- end }}
