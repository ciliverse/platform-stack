# Wires the APISIX ingress controller (2.x) to its data plane. Off by default:
# it only applies where the apisix release already runs.
apisixGatewayProxy:
  enabled: false
  name: apisix-proxy-config
  namespace: apisix
  ingressClass: apisix
  adminEndpoint: http://apisix-admin.apisix.svc.cluster.local:9180
  # Prefer a secret; adminKey is the plain value and lands in the manifest.
  adminKey: ""
  adminKeySecret: ""
  adminKeySecretKey: admin-key

metallb:
  enabled: false
  addresses: ""
  poolName: default-pool
  namespace: metallb-system

certManager:
  enabled: false

letsencrypt:
  enabled: false
  email: ""
  server: https://acme-v02.api.letsencrypt.org/directory
  ingressClass: apisix

# Self-signed root + a `ca` ClusterIssuer that signs from it. For names ACME
# cannot validate (private IPs, internal-only DNS). Requires certManager.
localCa:
  enabled: false
  name: local-ca
  issuerName: local-ca
  # cert-manager's cluster resource namespace.
  namespace: cert-manager
  secretName: local-ca-tls
  commonName: local-ca
  duration: 87600h
  renewBefore: 720h

exampleIngress:
  enabled: false
  clusterIssuer: selfsigned
  # Must be a class some running controller serves. Envoy Gateway does not
  # serve Ingress objects, only Gateway API ones.
  ingressClass: apisix
  cilikube:
    enabled: true
    namespace: cilikube
    host: ""
    serviceName: cilikube-frontend
    servicePort: 80
    tlsSecretName: cilikube-tls
  grafana:
    enabled: true
    namespace: monitoring
    host: ""
    serviceName: kube-prometheus-stack-grafana
    servicePort: 80
    tlsSecretName: grafana-tls
