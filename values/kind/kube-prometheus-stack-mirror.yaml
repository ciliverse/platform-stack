# Optional DaoCloud mirrors. Enable with helmfile -e kind --state-values-set kindMirror=true
# or set kindMirror: true in values/kind.yaml
prometheusOperator:
  image:
    registry: quay.m.daocloud.io
  prometheusConfigReloader:
    image:
      registry: quay.m.daocloud.io
  thanosImage:
    registry: quay.m.daocloud.io
  admissionWebhooks:
    patch:
      image:
        registry: ghcr.m.daocloud.io

prometheus:
  prometheusSpec:
    image:
      registry: quay.m.daocloud.io

alertmanager:
  alertmanagerSpec:
    image:
      registry: quay.m.daocloud.io

prometheus-node-exporter:
  image:
    registry: quay.m.daocloud.io

kube-state-metrics:
  image:
    registry: k8s.m.daocloud.io

grafana:
  image:
    registry: docker.m.daocloud.io
  sidecar:
    image:
      registry: quay.m.daocloud.io

crds:
  upgradeJob:
    image:
      busybox:
        registry: docker.m.daocloud.io
      kubectl:
        registry: k8s.m.daocloud.io
