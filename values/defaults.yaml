# Helmfile state values: switches, pins, namespaces.
# Categories (README): 代码 / CI / 镜像仓库 / CD / 流量入口 / 存储 / 中间件 / 可观测 / 服务网格 / 集群管理.
# metrics-server is cluster admin (HPA / kubectl top). GitLab Runner is CI. ExternalDNS is DNS for ingress.
# Chart-specific overlays live in values/apps/ and values/kind/.

kindMirror: false

# Points an installed Flux at a Git repository. What it watches is per-cluster,
# so gitUrl / kustomizations belong in values/private.yaml.
fluxGitops:
  enabled: false
  sourceName: gitops
  branch: main
  kustomizations: []

letsencrypt:
  enabled: false
# Self-signed root CA + `local-ca` ClusterIssuer, for hosts ACME cannot reach.
localCa:
  enabled: false
exampleIngress:
  enabled: false

apps:
  # --- 代码 / CI / CD / 镜像仓库 ---
  gitlab:
    enabled: false
    version: "10.0.1"
    namespace: gitlab
  jenkins:
    enabled: true
    version: "5.9.9"
    # JENKINS_HOME is a PVC; moving namespaces means migrating the volume.
    namespace: cicd
  argoCd:
    enabled: true
    version: "9.4.17"
    namespace: argocd
  flux2:
    enabled: true
    version: "2.18.4"
    namespace: flux-system
  harbor:
    enabled: false
    version: "1.19.2"
    namespace: harbor
  gitlabRunner:
    enabled: true
    # Pinned to what the cluster runs: values/apps/gitlab-runner.yaml carries a
    # runners.config block, and 0.9x reshuffled those keys more than once.
    version: "0.89.0"
    namespace: gitlab-runner

  # --- 流量入口 / 存储 / 集群管理 / 可观测 ---
  localPathProvisioner:
    enabled: true
    version: "0.0.38"
    namespace: local-path-storage
  metallb:
    enabled: true
    version: "0.16.1"
    namespace: metallb-system
  metricsServer:
    enabled: true
    version: "3.14.0"
    # Cluster addon, not an observability component: it backs HPA and
    # `kubectl top`, and its APIService is cluster-wide and single-owner.
    namespace: kube-system
  certManager:
    enabled: true
    version: "v1.21.2"
    namespace: cert-manager
  apisix:
    enabled: true
    version: "2.17.0"
    namespace: apisix
  gatewayApi:
    enabled: false
    version: "v1.9.1"
    namespace: envoy-gateway-system
  envoyGateway:
    enabled: false
    version: "v1.9.1"
    namespace: envoy-gateway-system
  externalDns:
    enabled: false
    version: "1.22.0"
    namespace: external-dns
  cilikube:
    enabled: true
    version: "1.0.0"
    namespace: cilikube
  headlamp:
    enabled: true
    # Skip 0.40.x: those charts pass `-session-ttl`, which the matching v0.40.1
    # binary rejects, so the container crash-loops. v0.45.0 accepts it.
    version: "0.45.0"
    namespace: headlamp
  kubePrometheusStack:
    enabled: true
    version: "86.1.1"
    namespace: monitoring
  # Traces live next to kube-prometheus-stack in `monitoring`: the collector
  # exports to Tempo by Service DNS, and Grafana links metrics to traces.
  opentelemetryCollector:
    enabled: true
    version: "0.147.1"
    namespace: monitoring
  tempo:
    enabled: true
    version: "1.24.4"
    namespace: monitoring
  victoriaLogs:
    enabled: true
    version: "0.13.9"
    namespace: observability
  victoriaLogsCollector:
    enabled: true
    version: "0.3.7"
    namespace: observability
  victoriaMetrics:
    enabled: false
    version: "0.46.0"
    namespace: observability
  loki:
    enabled: false
    version: "6.55.0"
    namespace: observability
  # Ships container logs to Loki. Installed with loki and into loki's
  # namespace, so it has no switch of its own — only a version to track.
  promtail:
    version: "6.17.1"
  pyroscope:
    enabled: true
    version: "2.3.1"
    namespace: observability
  beyla:
    enabled: false
    version: "1.16.11"
    namespace: observability
  istio:
    enabled: false
    version: "1.30.4"
    namespace: istio-system

  # --- 存储（对象 / JuiceFS）与中间件 ---
  postgresql:
    enabled: false
    version: "18.6.8"
    namespace: postgresql
  redis:
    enabled: false
    version: "25.5.3"
    namespace: redis
  rustfs:
    enabled: false
    version: "1.0.0-rc.6"
    namespace: rustfs
  minio:
    enabled: false
    version: "5.4.0"
    namespace: minio
  juicefsCsi:
    enabled: false
    version: "0.32.5"
    namespace: kube-system
  nats:
    enabled: false
    version: "2.14.6"
    namespace: nats
